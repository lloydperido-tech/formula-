<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log-in to CvSU-DRS</title>
    <link rel="icon" type="image/png" href="public/assets/pictures/cvsudrs.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="public/css/login.css" />
  </head>
  <body>
    <!-- NAVBAR - START -->
    <nav class="navbar">
      <a href="landing.html" class="logo">
        <img src="public/assets/logo/outlined-logo.svg" />
      </a>
      <button class="mobile-menu-toggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
      <ul>
        <li><a href="landing.html">Home</a></li>
        <li><a href="landing.html#whatiscvsu">About</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="faq.html">FAQs</a></li>
        <button><a href="#">Log-in</a></button>
      </ul>
    </nav>
    <!-- NAVBAR - END -->

    <main class="centered">
      <section class="auth-card compact" aria-label="Login form">
        <img class="form-logo" src="public/assets/logo/outlined-logo.svg" alt="CvSU DRS logo" />
        <h2>Log in</h2>
        <p class="muted">Choose account type and sign in with your CvSU email.</p>

        <div class="account-toggle" role="radiogroup" aria-label="Account type">
          <label class="account-chip active">
            <input type="radio" name="accountType" value="student" checked />
            <span>Student</span>
          </label>
          <label class="account-chip">
            <input type="radio" name="accountType" value="admin" />
            <span>Admin</span>
          </label>
        </div>

        <div id="errorMessage" class="alert error" role="alert"></div>
        <div id="successMessage" class="alert success" role="status"></div>

        <form id="loginForm" class="form-group">
          <input type="email" id="email" placeholder="CvSU Email" autocomplete="username" required />
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
          <input type="text" id="adminSecret" placeholder="Admin secret code" autocomplete="off" style="display: none;" />
          <button type="submit" class="primary-btn">Log In</button>
        </form>

        <div class="demo-block">
          <p class="muted note">Demo accounts</p>
          <ul>
            <li><strong>Student</strong>: student@cvsu.edu.ph / StudentPass123</li>
            <li><strong>Admin</strong>: admin@cvsu.edu.ph / AdminPass123 + secret code DRS-ADMIN-2025</li>
          </ul>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById('loginForm');
      const errorMessage = document.getElementById('errorMessage');
      const accountChips = document.querySelectorAll('.account-chip');
      const adminSecretInput = document.getElementById('adminSecret');

      const API_BASE = 'http://localhost:3000/api';

      accountChips.forEach((chip) => {
        chip.addEventListener('click', () => {
          accountChips.forEach((c) => c.classList.remove('active'));
          chip.classList.add('active');
          chip.querySelector('input').checked = true;

          const role = chip.querySelector('input').value;
          if (role === 'admin') {
            adminSecretInput.style.display = 'block';
            adminSecretInput.setAttribute('required', 'required');
          } else {
            adminSecretInput.style.display = 'none';
            adminSecretInput.removeAttribute('required');
            adminSecretInput.value = '';
          }
        });
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const role = document.querySelector('input[name="accountType"]:checked').value;
        const secretCode = role === 'admin' ? adminSecretInput.value.trim() : undefined;

        errorMessage.style.display = 'none';

        const payload = { email, password, role };
        if (role === 'admin') payload.secretCode = secretCode;

        try {
          const response = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            errorMessage.textContent = data.message || 'Login failed. Please check your credentials.';
            errorMessage.style.display = 'block';
            return;
          }

          localStorage.setItem('token', data.token);
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          // Store userInfo for profile page
          const userInfo = {
            firstName: data.user.firstName,
            lastName: data.user.lastName,
            middleName: '',
            email: data.user.email,
            studentNumber: data.user.studentNumber,
            program: data.user.program,
            yearLevel: data.user.yearLevel,
            contactNumber: '',
            completeAddress: data.user.address || ''
          };
          localStorage.setItem('userInfo', JSON.stringify(userInfo));
          
          window.location.href = data.user.role === 'admin' ? 'admin_dashboard.html' : 's_dashboard.html';
        } catch (error) {
          errorMessage.textContent = 'Server error. Please try again.';
          errorMessage.style.display = 'block';
        }
      });
    </script>
    <script src="public/js/mobile-menu.js"></script>
  </body>
</html>
